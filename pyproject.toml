[project]
name = "rag-normas-regulamentadoras"
version = "0.1.0"
description = "RAG over Brazilian workplace-safety regulations (NRs), with hybrid retrieval and cited answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.1",
    "supabase>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_nr"]
